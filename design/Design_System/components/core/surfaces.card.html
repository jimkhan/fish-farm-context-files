<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--bg);font-family:var(--font-base);padding:20px;color:var(--text-primary)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.lbl{font-size:12px;color:var(--text-secondary);width:100%;margin-bottom:-4px;font-weight:500}</style>
</head>
<body>
<div id="root"></div><script type="text/babel">
const NS = window.FMSAquacultureDesignSystem_dbe44a;
const { Card, CardHeader, Badge, IconButton } = NS;
function Demo(){return (<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
  <Card>
    <CardHeader title="Pond A2 — Water quality" subtitle="SPF Golda · Active batch"
      action={<IconButton icon="refresh-cw" label="Refresh" size="sm" variant="ghost" />} />
    <div style={{fontSize:14,color:"var(--text-secondary)",lineHeight:1.5}}>Dissolved oxygen, pH and temperature within normal range.</div>
  </Card>
  <div>
    <div className="lbl" style={{marginBottom:8}}>Badge tones</div>
    <div className="row">
      <Badge tone="brand" dot>SPF Golda</Badge>
      <Badge tone="ok" icon="check">Healthy</Badge>
      <Badge tone="info" dot>Info</Badge>
    </div>
    <div className="row">
      <Badge tone="warning" icon="alert-triangle">Stale</Badge>
      <Badge tone="critical" dot>Critical</Badge>
      <Badge tone="neutral" dot>Neutral</Badge>
    </div>
  </div>
</div>);}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
</body>
</html>
