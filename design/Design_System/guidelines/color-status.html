<!-- @dsCard group="Colors" viewport="700x150" name="Status" subtitle="ok / muted / danger" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--surface);font-family:var(--font-base);color:var(--text-primary)}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}</style>
</head><body><div class="g"><div style="display:flex;flex-direction:column;gap:6px">
  <div style="height:56px;border-radius:10px;background:#16A34A;border:1px solid var(--border)"></div>
  <div style="font-size:12px;font-weight:500">ok / positive</div>
  <div style="font-size:11px;color:var(--text-secondary);font-family:var(--font-mono)">#16A34A</div>
</div><div style="display:flex;flex-direction:column;gap:6px">
  <div style="height:56px;border-radius:10px;background:#94A3B8;border:1px solid var(--border)"></div>
  <div style="font-size:12px;font-weight:500">muted</div>
  <div style="font-size:11px;color:var(--text-secondary);font-family:var(--font-mono)">#94A3B8</div>
</div><div style="display:flex;flex-direction:column;gap:6px">
  <div style="height:56px;border-radius:10px;background:#DC2626;border:1px solid var(--border)"></div>
  <div style="font-size:12px;font-weight:500">danger</div>
  <div style="font-size:11px;color:var(--text-secondary);font-family:var(--font-mono)">#DC2626</div>
</div></div></body></html>
