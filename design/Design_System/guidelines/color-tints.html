<!-- @dsCard group="Colors" viewport="700x150" name="Tinted surfaces" subtitle="Calm badge/banner fills" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--surface);font-family:var(--font-base);color:var(--text-primary)}.g{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}</style>
</head><body><div class="g"><div style="display:flex;flex-direction:column;gap:6px">
  <div style="height:56px;border-radius:10px;background:#ECFEFF;border:1px solid var(--border)"></div>
  <div style="font-size:12px;font-weight:500">tint-brand</div>
  <div style="font-size:11px;color:var(--text-secondary);font-family:var(--font-mono)">#ECFEFF</div>
</div><div style="display:flex;flex-direction:column;gap:6px">
  <div style="height:56px;border-radius:10px;background:#EFF6FF;border:1px solid var(--border)"></div>
  <div style="font-size:12px;font-weight:500">tint-info</div>
  <div style="font-size:11px;color:var(--text-secondary);font-family:var(--font-mono)">#EFF6FF</div>
</div><div style="display:flex;flex-direction:column;gap:6px">
  <div style="height:56px;border-radius:10px;background:#FFFBEB;border:1px solid var(--border)"></div>
  <div style="font-size:12px;font-weight:500">tint-warning</div>
  <div style="font-size:11px;color:var(--text-secondary);font-family:var(--font-mono)">#FFFBEB</div>
</div><div style="display:flex;flex-direction:column;gap:6px">
  <div style="height:56px;border-radius:10px;background:#FEF2F2;border:1px solid var(--border)"></div>
  <div style="font-size:12px;font-weight:500">tint-critical</div>
  <div style="font-size:11px;color:var(--text-secondary);font-family:var(--font-mono)">#FEF2F2</div>
</div><div style="display:flex;flex-direction:column;gap:6px">
  <div style="height:56px;border-radius:10px;background:#F0FDF4;border:1px solid var(--border)"></div>
  <div style="font-size:12px;font-weight:500">tint-ok</div>
  <div style="font-size:11px;color:var(--text-secondary);font-family:var(--font-mono)">#F0FDF4</div>
</div></div></body></html>
