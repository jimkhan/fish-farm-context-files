<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--surface);font-family:var(--font-base);color:var(--text-primary)}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}</style>
</head><body><div class="g"><div style="display:flex;flex-direction:column;gap:6px">
  <div style="height:56px;border-radius:10px;background:#0E7490;border:1px solid var(--border)"></div>
  <div style="font-size:12px;font-weight:500">primary</div>
  <div style="font-size:11px;color:var(--text-secondary);font-family:var(--font-mono)">#0E7490</div>
</div><div style="display:flex;flex-direction:column;gap:6px">
  <div style="height:56px;border-radius:10px;background:#155E75;border:1px solid var(--border)"></div>
  <div style="font-size:12px;font-weight:500">primaryDark</div>
  <div style="font-size:11px;color:var(--text-secondary);font-family:var(--font-mono)">#155E75</div>
</div><div style="display:flex;flex-direction:column;gap:6px">
  <div style="height:56px;border-radius:10px;background:#0891B2;border:1px solid var(--border)"></div>
  <div style="font-size:12px;font-weight:500">accent</div>
  <div style="font-size:11px;color:var(--text-secondary);font-family:var(--font-mono)">#0891B2</div>
</div></div></body></html>
